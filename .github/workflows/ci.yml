name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Python compile
        run: python -m compileall -q app scripts
      - name: Tests
        run: python -m pytest -q
      - name: Frontend syntax
        run: node --check web/app.js
      - name: Package source
        run: |
          zip -r digital-goods-v1.2.1-opportunity-agent-engine.zip . \
            -x ".git/*" ".env" "data/*.db" "*/__pycache__/*" "*.pyc"
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: digital-goods-v1.2.1-opportunity-agent-engine
          path: digital-goods-v1.2.1-opportunity-agent-engine.zip
          if-no-files-found: error
